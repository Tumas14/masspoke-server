<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Masspoke — Login</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Segoe UI', Tahoma, sans-serif;
      background: linear-gradient(160deg, #1e1f22 0%, #313338 55%, #232428 100%);
      color: #fff;
    }
    .card {
      width: 340px;
      padding: 28px 24px;
      background: rgba(30, 31, 34, 0.95);
      border: 1px solid #5865F2;
      border-radius: 12px;
      text-align: center;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.45);
    }
    h1 {
      margin: 0 0 8px;
      font-size: 22px;
      color: #5865F2;
      letter-spacing: 0.04em;
    }
    p {
      margin: 0 0 22px;
      font-size: 13px;
      color: #B5BAC1;
      line-height: 1.45;
    }
    button {
      width: 100%;
      border: none;
      border-radius: 6px;
      padding: 12px 14px;
      background: #5865F2;
      color: #fff;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }
    button:hover { background: #4752C4; }
    button:disabled { opacity: 0.6; cursor: wait; }
    .status {
      margin-top: 14px;
      min-height: 18px;
      font-size: 12px;
      color: #F23F43;
    }
    .status.ok { color: #23A559; }
  </style>
</head>
<body>
  <div class="card">
    <h1>MASSPOKE</h1>
    <p>Inicia sesión una vez con Discord. Solo recibirás pokes de servidores donde tengas el rol masspoke.</p>
    <button id="loginBtn">Log in with Discord</button>
    <div id="status" class="status"></div>
  </div>
  <script>
    const { ipcRenderer } = require('electron');
    const loginBtn = document.getElementById('loginBtn');
    const status = document.getElementById('status');

    loginBtn.addEventListener('click', () => {
      loginBtn.disabled = true;
      status.className = 'status';
      status.textContent = 'Opening Discord…';
      ipcRenderer.send('start-discord-login');
    });

    ipcRenderer.on('login-status', (_e, payload) => {
      if (payload.ok) {
        status.className = 'status ok';
        status.textContent = payload.message || 'Logged in';
      } else {
        loginBtn.disabled = false;
        status.className = 'status';
        status.textContent = payload.message || 'Login failed';
      }
    });
  </script>
</body>
</html>
